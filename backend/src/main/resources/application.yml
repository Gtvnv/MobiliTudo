spring:
  application:
    name: mobilitudo-backend

  datasource:
    url: ${MOBILITUDO_DB_URL:jdbc:postgresql://localhost:5432/mobilitudo}
    username: ${MOBILITUDO_DB_USER:mobilitudo}
    password: ${MOBILITUDO_DB_PASSWORD:mobilitudo}

  jpa:
    open-in-view: false
    hibernate:
      # O esquema e propriedade das migracoes Flyway. Deixar o Hibernate gerar DDL
      # faria as colunas geometry(...) nascerem sem SRID e sem indice GiST.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null

server:
  port: ${MOBILITUDO_PORT:8080}
  error:
    include-message: always

mobilitudo:
  cors:
    # Hosts autorizados a consumir a API a partir do navegador.
    origens: ${MOBILITUDO_CORS_ORIGENS:http://localhost:*,http://127.0.0.1:*}
  seguranca:
    # Segredo exigido para validar, rejeitar ou resolver um obstáculo. Sem ele, a
    # curadoria fica bloqueada (falha fechada) — ver FiltroAutenticacaoCurador.
    token-curador: ${MOBILITUDO_CURADOR_TOKEN:}
  rate-limit:
    # Limite de relatos de obstáculo por IP, para conter abuso sem exigir cadastro.
    obstaculos-por-hora: ${MOBILITUDO_LIMITE_OBSTACULOS_HORA:20}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /docs

logging:
  level:
    br.com.mobilitudo: INFO
