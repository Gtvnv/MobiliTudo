spring:
  application:
    name: mobilitudo-backend

  datasource:
    url: ${MOBILITUDO_DB_URL:jdbc:postgresql://localhost:5432/mobilitudo}
    username: ${MOBILITUDO_DB_USER:mobilitudo}
    password: ${MOBILITUDO_DB_PASSWORD:mobilitudo}

  jpa:
    open-in-view: false
    hibernate:
      # O esquema e propriedade das migracoes Flyway. Deixar o Hibernate gerar DDL
      # faria as colunas geometry(...) nascerem sem SRID e sem indice GiST.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null

server:
  port: ${MOBILITUDO_PORT:8080}
  error:
    # "never", não "always": isto só afeta o fallback padrão do Spring Boot, para
    # exceções que NÃO passam por ManipuladorGlobalDeErros — ali as mensagens são
    # escritas à mão, pensadas para quem consome a API, e continuam aparecendo
    # normalmente. "always" vazava a mensagem bruta de qualquer exceção inesperada
    # (ex.: "Invalid UUID string: ..." do próprio java.util.UUID) para quem chamou a
    # API — nada catastrófico até aqui, mas é política de vazar por padrão, não a
    # exceção cuidadosamente decidida caso a caso.
    include-message: never

mobilitudo:
  cors:
    # Hosts autorizados a consumir a API a partir do navegador.
    origens: ${MOBILITUDO_CORS_ORIGENS:http://localhost:*,http://127.0.0.1:*}
  seguranca:
    # Cria o primeiro curador no boot, se a tabela de curadores estiver vazia — sem
    # isso, ninguém consegue logar para cadastrar o primeiro. Ver BootstrapDoPrimeiroCurador.
    curador-inicial-email: ${MOBILITUDO_CURADOR_INICIAL_EMAIL:}
    curador-inicial-senha: ${MOBILITUDO_CURADOR_INICIAL_SENHA:}
    # Validade da sessão de login de um curador.
    sessao-curador-dias: ${MOBILITUDO_SESSAO_CURADOR_DIAS:30}
  rate-limit:
    # Limite de relatos de obstáculo por IP, para conter abuso sem exigir cadastro.
    obstaculos-por-hora: ${MOBILITUDO_LIMITE_OBSTACULOS_HORA:20}
    # Limite de tentativas de login por IP, para conter força bruta de senha.
    login-tentativas-por-hora: ${MOBILITUDO_LIMITE_LOGIN_HORA:10}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /docs

logging:
  level:
    br.com.mobilitudo: INFO
